<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Yakınımda Ne Var?</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; }
        .cat-btn {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 5px; color: white;
            font-weight: 700; font-size: 10px; line-height: 1.3;
            text-align: center; aspect-ratio: 1/1; width: 100%;
            border: none; border-radius: 24px; cursor: pointer;
            transition: transform 0.1s ease; padding: 6px;
            -webkit-tap-highlight-color: transparent;
            position: relative; z-index: 1;
        }
        .cat-btn:active { transform: scale(0.92); }
        .cat-btn i { font-size: 22px; display: block; }
        .mode-btn {
            flex: 1; padding: 9px 4px; font-size: 11px; font-weight: 700;
            border-radius: 12px; border: none; background: transparent;
            color: #9ca3af; cursor: pointer; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .mode-btn.active { background: white; color: #2563eb; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
        .loader {
            width: 36px; height: 36px; border: 4px solid #e2e8f0;
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div style="max-width:480px; margin:0 auto; padding:28px 14px;">

    <!-- Başlık -->
    <div style="margin-bottom:24px;">
        <h1 style="font-size:26px; font-weight:800; color:#111827; margin:0 0 10px 0;">Yakınımda Ne Var?</h1>
        <div style="display:flex; align-items:center; gap:7px; font-size:13px; flex-wrap:wrap;">
            <i class="fa-solid fa-location-dot" style="color:#3b82f6;"></i>
            <span style="color:#6b7280; font-weight:500;">Konumunuz:</span>
            <span id="loc-text" style="color:#111827; font-weight:800; cursor:pointer; text-decoration:underline dotted; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="Tıklayarak değiştir">Konum aranıyor...</span>
            <i class="fa-solid fa-rotate-right" style="color:#9ca3af; cursor:pointer; font-size:12px;" onclick="startLocation()"></i>
        </div>
    </div>

    <!-- Mod Seçici -->
    <div style="display:flex; background:#f1f5f9; padding:4px; border-radius:16px; margin-bottom:18px; gap:2px;">
        <button class="mode-btn active" id="m-daily" onclick="applyMode('daily')"><i class="fa-solid fa-house-user"></i> Günlük</button>
        <button class="mode-btn" id="m-tourist" onclick="applyMode('tourist')"><i class="fa-solid fa-map-location-dot"></i> Turist</button>
        <button class="mode-btn" id="m-emergency" onclick="applyMode('emergency')"><i class="fa-solid fa-triangle-exclamation"></i> Acil</button>
    </div>

    <!-- Kategori Grid -->
    <div id="cat-grid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;">
        <button class="cat-btn" style="background:#22c55e;box-shadow:0 4px 14px rgba(34,197,94,.4);" onclick="catClick('nobetci_eczane',true)"><i class="fa-solid fa-capsules"></i><span>Nöbetçi<br>Eczaneler</span></button>
        <button class="cat-btn" style="background:#3b82f6;box-shadow:0 4px 14px rgba(59,130,246,.4);" onclick="catClick('atm',false)"><i class="fa-solid fa-money-bill-1-wave"></i><span>En Yakın<br>ATM</span></button>
        <button class="cat-btn" style="background:#ef4444;box-shadow:0 4px 14px rgba(239,68,68,.4);" onclick="catClick('hospital',false)"><i class="fa-regular fa-hospital"></i><span>En Yakın<br>Hastaneler</span></button>
        <button class="cat-btn" style="background:#f43f5e;box-shadow:0 4px 14px rgba(244,63,94,.4);" onclick="catClick('restaurant',false)"><i class="fa-solid fa-utensils"></i><span>Cafe &<br>Restoranlar</span></button>
        <button class="cat-btn" style="background:#2dd4bf;box-shadow:0 4px 14px rgba(20,184,166,.4);" onclick="catClick('supermarket',false)"><i class="fa-solid fa-bag-shopping"></i><span>En Yakın<br>Marketler</span></button>
        <button class="cat-btn" style="background:#eab308;box-shadow:0 4px 14px rgba(234,179,8,.4);" onclick="catClick('fuel',false)"><i class="fa-solid fa-gas-pump"></i><span>En Yakın<br>Benzinlikler</span></button>
        <button class="cat-btn" style="background:#ec4899;box-shadow:0 4px 14px rgba(236,72,153,.4);" onclick="catClick('clothes',false)"><i class="fa-solid fa-shirt"></i><span>Giyim<br>Mağazaları</span></button>
        <button class="cat-btn" style="background:#8b5cf6;box-shadow:0 4px 14px rgba(139,92,246,.4);" onclick="catClick('parking',false)"><i class="fa-solid fa-square-parking"></i><span>En Yakın<br>Otoparklar</span></button>
        <button class="cat-btn" style="background:#f59e0b;box-shadow:0 4px 14px rgba(245,158,11,.4);" onclick="catClick('taxi',false)"><i class="fa-solid fa-taxi"></i><span>Taksi<br>Durakları</span></button>
        <button class="cat-btn" style="background:#6366f1;box-shadow:0 4px 14px rgba(99,102,241,.4);" onclick="catClick('tourism',false)"><i class="fa-solid fa-camera-retro"></i><span>Turistik<br>Yerler</span></button>
        <button class="cat-btn" style="background:#0ea5e9;box-shadow:0 4px 14px rgba(14,165,233,.4);" onclick="catClick('hotel',false)"><i class="fa-regular fa-building"></i><span>En Yakın<br>Oteller</span></button>
        <button class="cat-btn" style="background:#f97316;box-shadow:0 4px 14px rgba(249,115,22,.4);" onclick="catClick('post_office',false)"><i class="fa-solid fa-truck-fast"></i><span>Kargo<br>Şubeleri</span></button>
        <button class="cat-btn" style="background:#10b981;box-shadow:0 4px 14px rgba(16,185,129,.4);" onclick="catClick('assembly_point',false)"><i class="fa-solid fa-users"></i><span>Toplanma<br>Alanları</span></button>
        <button class="cat-btn" style="background:#475569;box-shadow:0 4px 14px rgba(71,85,105,.4);" onclick="catClick('police',false)"><i class="fa-solid fa-shield-halved"></i><span>Polis<br>Merkezi</span></button>
        <button class="cat-btn" style="background:#22c55e;box-shadow:0 4px 14px rgba(34,197,94,.4);" onclick="catClick('pharmacy',false)"><i class="fa-solid fa-capsules"></i><span>En Yakın<br>Eczaneler</span></button>
    </div>

    <!-- Standart Aksiyonlar -->
    <div id="std-actions" style="display:flex; flex-direction:column; gap:10px;">
        <a href="tel:112" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;background:#ef4444;color:white;border-radius:18px;font-weight:700;text-decoration:none;font-size:15px;">
            <i class="fa-solid fa-phone-volume"></i> 112 Acil Çağrı
        </a>
        <button onclick="shareWhatsApp()" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;background:#22c55e;color:white;border-radius:18px;font-weight:700;border:none;cursor:pointer;font-size:15px;width:100%;">
            <i class="fa-solid fa-share-nodes"></i> Konumumu Paylaş (WhatsApp)
        </button>
    </div>

    <!-- Acil Aksiyonlar (gizli) -->
    <div id="emg-actions" style="display:none; flex-direction:column; gap:10px;">
        <button onclick="sendSMS()" style="padding:22px;background:#ef4444;color:white;border-radius:28px;font-size:19px;font-weight:900;border:none;cursor:pointer;width:100%;">
            <i class="fa-solid fa-comment-sms" style="font-size:26px;display:block;margin-bottom:5px;"></i>
            KONUMUMU SMS AT
        </button>
    </div>
</div>

<!-- Bildir -->
<button onclick="window.location.href='mailto:ertugrultokgoz25@gmail.com'"
    style="position:fixed;bottom:16px;right:16px;z-index:100;background:#111827;color:white;font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);">
    <i class="fa-regular fa-comment"></i> Bildir
</button>

<!-- Sonuç Modalı -->
<div id="result-modal" style="display:none;position:fixed;inset:0;z-index:200;flex-direction:column;justify-content:flex-end;">
    <div onclick="closeModal()" style="position:absolute;inset:0;background:rgba(0,0,0,.5);"></div>
    <div style="position:relative;z-index:1;background:white;width:100%;max-height:82vh;border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;flex-shrink:0;">
            <h3 id="result-title" style="margin:0;font-weight:700;color:#1f2937;font-size:16px;display:flex;align-items:center;gap:8px;">
                <i class="fa-solid fa-map-location-dot" style="color:#3b82f6;"></i> Sonuçlar
            </h3>
            <button onclick="closeModal()" style="width:32px;height:32px;border-radius:50%;background:#f1f5f9;border:none;cursor:pointer;font-size:16px;color:#6b7280;">✕</button>
        </div>
        <div id="result-list" style="padding:16px;overflow-y:auto;flex:1;"></div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
